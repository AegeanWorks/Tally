<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc" data-motif="ledger" data-layout="terminal">
  <title id="title">Tally social preview</title>
  <desc id="desc">A dependency-free, local-first expense ledger for the terminal. Record what you spend, list it, and see where the money went. Everything stays in one readable JSON file on your machine.</desc>
