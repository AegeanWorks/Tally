  <text x="78" y="206" font-family="Consolas, monospace" font-size="20" fill="#7dd3fc">$ open Tally</text><text x="78" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="76" font-weight="700" fill="#F8FAFC">Tally</text>
  <text x="80" y="348" font-family="Consolas, monospace" font-size="25" fill="#F8FAFC" fill-opacity="0.72">A dependency-free, local-first expense ledger for</text><text x="80" y="388" font-family="Consolas, monospace" font-size="25" fill="#F8FAFC" fill-opacity="0.72">the terminal. Record what you spend, list it, and</text><text x="80" y="428" font-family="Consolas, monospace" font-size="25" fill="#F8FAFC" fill-opacity="0.72">see where the money went. Everything stays in one</text>
